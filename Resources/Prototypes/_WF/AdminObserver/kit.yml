  id: WFAdminObserverGear
  equipment:
    back: ClothingBackpackSatchelHolding
    id: NFAdminPDA
  storage:
    back:
    - Omnitool
    - ToolDebug
    - JawsOfLife
    - WelderExperimental
    - Multitool
    - GasAnalyzer
    - trayScanner
    - ShipRepairDeviceAdmin
    - FireExtinguisherBluespace
    - HolofanProjector
    - RPED
    - AdminHypo
    - HandheldHealthAnalyzer
    - BluespaceBeaker
    - SyringeBluespace
    - UniversalIDCard
    - AccessConfiguratorUniversal
    - DoorRemoteAll
    - EmagUnlimited
