# The staff marker's visuals. Every sprite is used where it already is; none is copied.

# The sigil beside the head: by rank, never chosen. Its priority stays above the new-player mark's, which has to
# be drawn before every other icon of the right-hand column (MarkTakesNoHudSlotTest).
- type: ssdIcon
  id: WFStaffSigilAdmin
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: Admin
  locationPreference: Right
  priority: 0

- type: ssdIcon
  id: WFStaffSigilHost
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: MindShield
  locationPreference: Right
  priority: 0

- type: shader
  id: WFStaffMarkerTint
  kind: source
  path: "/Textures/_WF/AdminObserver/Shaders/staff_tint.swsl"
  params:
    minimum: 0

- type: shader
  id: WFStaffMarkerTintSolid
  kind: source
  path: "/Textures/_WF/AdminObserver/Shaders/staff_tint.swsl"
  params:
    minimum: 1

# The aura's light. Each client spawns its own beside a marked entity; the server never does.
- type: entity
  id: WFStaffMarkerAuraLight
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    radius: 2.5
    energy: 2
    softness: 1
    netsync: false

# Ground rings.
