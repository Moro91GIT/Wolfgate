# The Bluespace and Subspace Technician's worn gear. The art of the uniforms, jackets, visors, masks, gauntlets and
# shield projector is the MeridianClothing port's; behaviour goes on these children, never in its generated files.
# Each piece gives its wearer one power while worn and takes it back when it comes off.

- type: entity
  abstract: true
  id: WFAdminTechGearBase
  components:
  - type: WFAdminGear

# Uniform: marks the wearer as staff.
- type: entity
  parent: [ WFAdminTechGearBase, WFMeridianClothingUnderAdmin ]
  id: WFAdminTechUniformBluespace
  components:
  - type: WFStaffUniform

- type: entity
  parent: [ WFAdminTechGearBase, WFMeridianClothingUnderAdminSubspace ]
  id: WFAdminTechUniformSubspace
  components:
  - type: WFStaffUniform

- type: entity
  parent: [ WFAdminTechGearBase, WFMeridianClothingSuitAdmin ]
  id: WFAdminTechJacketBluespace

- type: entity
  parent: [ WFAdminTechGearBase, WFMeridianClothingSuitAdminSubspace ]
  id: WFAdminTechJacketSubspace

# Visor: hides who is under it, reads every HUD and speaks every language.
- type: entity
  abstract: true
  parent: [ WFAdminTechGearBase, ShowSecurityIcons, ShowMedicalIcons ]
  id: WFAdminTechVisorBase
  components:
  - type: IdentityBlocker
  - type: ClothingGrantComponent
    component:
    - type: UniversalLanguageSpeaker
    - type: ShowAntagIcons
    - type: ShowSyndicateIcons

- type: entity
  parent: [ WFAdminTechVisorBase, WFMeridianClothingHeadHelmetPerceptomatrixAdmin ]
  id: WFAdminTechVisorBluespace

- type: entity
  parent: [ WFAdminTechVisorBase, WFMeridianClothingHeadHelmetPerceptomatrixAdminSubspace ]
  id: WFAdminTechVisorSubspace

# Mask: no air needed.
- type: entity
  abstract: true
  parent: WFAdminTechGearBase
  id: WFAdminTechMaskBase
  components:
  - type: ClothingGrantComponent
    component:
    - type: BreathingImmunity
    - type: PressureImmunity

- type: entity
  parent: [ WFAdminTechMaskBase, WFMeridianClothingMaskGasAtmosAdmin ]
  id: WFAdminTechMaskBluespace

- type: entity
  parent: [ WFAdminTechMaskBase, WFMeridianClothingMaskGasAtmosAdminSubspace ]
  id: WFAdminTechMaskSubspace

# Gauntlets: reach anything, and do it at once. Both share the one sprite Meridian Rift has for them.
- type: entity
  parent: [ WFAdminTechGearBase, WFMeridianClothingGlovesTacklerAdmin ]
  id: WFAdminTechGauntletsBluespace
  components:
  - type: ClothingGrantComponent
    component:
    - type: BypassInteractionChecks
    - type: IgnoreUIRange
  - type: WFGrantTags
    tags:
    - BypassInteractionRangeChecks
    - InstantDoAfters

- type: entity
  parent: WFAdminTechGauntletsBluespace
  id: WFAdminTechGauntletsSubspace

# Magboots: the advanced magboots in the technician's colours.
- type: entity
  parent: [ WFAdminTechGearBase, ClothingShoesBootsMagAdv ]
  id: WFAdminTechMagbootsBluespace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/magboots_bluespace.rsi
  - type: Clothing
    sprite: _WF/AdminTech/magboots_bluespace.rsi

- type: entity
  parent: [ WFAdminTechGearBase, ClothingShoesBootsMagAdv ]
  id: WFAdminTechMagbootsSubspace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/magboots_subspace.rsi
  - type: Clothing
    sprite: _WF/AdminTech/magboots_subspace.rsi

# Headset: every channel.
- type: entity
  abstract: true
  parent: [ WFAdminTechGearBase, ClothingHeadsetAltCentCom ]
  id: WFAdminTechHeadsetBase
  components:
  - type: EncryptionKeyHolder
    keySlots: 12
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCentCom
      - EncryptionKeyStationMaster
      - EncryptionKeyCommon
      - EncryptionKeyNfsd
      - EncryptionKeyTraffic
      - EncryptionKeyFreelance
      - EncryptionKeySyndie

- type: entity
  parent: WFAdminTechHeadsetBase
  id: WFAdminTechHeadsetBluespace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/headset_bluespace.rsi
  - type: Clothing
    sprite: _WF/AdminTech/headset_bluespace.rsi

- type: entity
  parent: WFAdminTechHeadsetBase
  id: WFAdminTechHeadsetSubspace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/headset_subspace.rsi
  - type: Clothing
    sprite: _WF/AdminTech/headset_subspace.rsi

# Contacts: nothing to see when worn. The HUDs are on the visor.
- type: entity
  parent: [ WFAdminTechGearBase, ClothingEyesBase ]
  id: WFAdminTechContacts
  components:
  - type: Sprite
    sprite: _WF/AdminTech/contacts.rsi
    state: icon
  - type: Clothing
    sprite: _WF/AdminTech/contacts.rsi

# Shield projector, on the neck: nothing hurts the wearer.
- type: entity
  parent: [ WFAdminTechGearBase, WFMeridianClothingAccessoryEnergyShieldAdmin ]
  id: WFAdminTechShieldProjectorBluespace
  components:
  - type: ClothingGrantComponent
    component:
    - type: Godmode

- type: entity
  parent: WFAdminTechShieldProjectorBluespace
  id: WFAdminTechShieldProjectorSubspace

# Cytotheca: storage worn on the neck, beside the shield projector.
- type: entity
  parent: [ WFAdminTechGearBase, ClothingNeckBase ]
  id: WFAdminTechCytothecaBluespace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/cytotheca.rsi
    state: icon
  - type: Clothing
    sprite: _WF/AdminTech/cytotheca.rsi
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,3
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  parent: WFAdminTechCytothecaBluespace
  id: WFAdminTechCytothecaSubspace
  components:
  - type: Item
    size: Large
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,9,5

# ID cards: every access.
- type: entity
  parent: [ WFAdminTechGearBase, UniversalIDCard ]
  id: WFAdminTechIdAdmin
  suffix: Admin Tech

- type: entity
  parent: WFAdminTechIdAdmin
  id: WFAdminTechIdBluespace
  components:
  - type: IdCard
    jobTitle: wf-observer-preset-stock-bluespace

- type: entity
  parent: WFAdminTechIdAdmin
  id: WFAdminTechIdSubspace
  components:
  - type: IdCard
    jobTitle: wf-observer-preset-stock-subspace

- type: entity
  parent: WFAdminTechIdAdmin
  id: WFAdminTechIdCentCom
