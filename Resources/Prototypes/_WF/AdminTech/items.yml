# The technician's tools and storage. Each is an existing item with a few fields changed; names and descriptions
# come from Fluent.

# Tools.
- type: entity
  parent: Multitool
  id: WFAdminTechMultitool
  components:
  - type: Sprite
    sprite: _WF/AdminTech/multitool.rsi
    layers:
    - state: icon
  - type: WFWireLegend

- type: entity
  parent: HandheldHealthAnalyzer
  id: WFAdminTechHealthAnalyzer
  suffix: Admin Tech

- type: entity
  parent: RPED
  id: WFAdminTechRped
  components:
  - type: Storage
    grid:
    - 0,0,9,5
  - type: StorageFill
    contents:
    - id: CapacitorStockPart
      amount: 4
    - id: MatterBinStockPart
      amount: 4
    - id: MicroManipulatorStockPart
      amount: 4

- type: entity
  parent: WeaponEnergyGunMultiphase
  id: WFAdminTechCarbine
  components:
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 400

# Storage. The belt satchels come filled; the rest are empty.
- type: entity
  abstract: true
  parent: [ WFAdminTechGearBase, ClothingBeltStorageBase ]
  id: WFAdminTechSatchelBase
  components:
  - type: Sprite
    sprite: _WF/AdminTech/satchel.rsi
    state: icon
  - type: Clothing
    sprite: _WF/AdminTech/satchel.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,5

- type: entity
  parent: WFAdminTechSatchelBase
  id: WFAdminTechSatchelBluespace
  components:
  - type: StorageFill
    contents:
    - id: Omnitool
    - id: JawsOfLife
    - id: WelderExperimental
    - id: Multitool
    - id: DoorRemoteAll
    - id: RCDExperimental
    - id: HolofanProjector
    - id: LightReplacer
    - id: WFAdminTechHealthAnalyzer

- type: entity
  parent: WFAdminTechSatchelBase
  id: WFAdminTechSatchelSubspace
  components:
  - type: StorageFill
    contents:
    - id: Omnitool
    - id: JawsOfLife
    - id: WelderExperimental
    - id: WFAdminTechMultitool
    - id: DoorRemoteAll
    - id: RCDExperimental
    - id: HolofanProjector
    - id: HoloprojectorField
    - id: LightReplacer
    - id: WFAdminTechHealthAnalyzer
    - id: WFAdminTechRped
    - id: EmagUnlimited
    - id: AccessBreakerUnlimited
    - id: PinpointerUniversalDebug
    - id: AdminHypo

- type: entity
  abstract: true
  parent: BaseStorageItem
  id: WFAdminTechPocketBase
  components:
  - type: Item
    size: Small
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,5,3

- type: entity
  parent: WFAdminTechPocketBase
  id: WFAdminTechPocketBluespace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/pocket_bluespace.rsi
    state: icon

- type: entity
  parent: WFAdminTechPocketBase
  id: WFAdminTechPocketSubspace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/pocket_subspace.rsi
    state: icon
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,5

# The pouch the kit's categories are sorted into.
- type: entity
  parent: WFAdminTechPocketBase
  id: WFAdminTechPouch
  components:
  - type: Sprite
    sprite: _WF/AdminTech/pocket_subspace.rsi
    state: icon
  - type: Storage
    maxItemSize: Large
    grid:
    - 0,0,7,3

- type: entity
  parent: WFAdminTechPocketBase
  id: WFAdminTechConstructionBagBluespace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/construction_bag_bluespace.rsi
    state: icon
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,5

- type: entity
  parent: WFAdminTechConstructionBagBluespace
  id: WFAdminTechConstructionBagSubspace
  components:
  - type: Sprite
    sprite: _WF/AdminTech/construction_bag_subspace.rsi
    state: icon
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,11,7

- type: entity
  parent: BoxBase
  id: WFAdminTechBox
  components:
  - type: Sprite
    state: box
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,9,7

# Tanks: seven times a standard tank, in the hand. Wolfgate has no pluoxium, healium, nitrium, halon, BZ or helium,
# so the pluoxium tank and the three mixes of the original are not here.
- type: entity
  abstract: true
  parent: GasTankBase
  id: WFAdminTechTankBase
  components:
  - type: Sprite
    sprite: _WF/AdminTech/tank.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _WF/AdminTech/tank.rsi
  - type: Clothing
    sprite: _WF/AdminTech/tank.rsi
    slots:
    - Belt
    - suitStorage

- type: entity
  parent: WFAdminTechTankBase
  id: WFAdminTechTankOxygen
  components:
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 70
      moles:
        Oxygen: 28.7
      temperature: 293.15

- type: entity
  parent: WFAdminTechTankBase
  id: WFAdminTechTankNitrogen
  components:
  - type: GasTank
    outputPressure: 21.3
    air:
      volume: 70
      moles:
        Nitrogen: 28.7
      temperature: 293.15

- type: entity
  parent: WFAdminTechTankBase
  id: WFAdminTechTankPlasma
  components:
  - type: GasTank
    outputPressure: 101.3
    air:
      volume: 70
      moles:
        Plasma: 28.7
      temperature: 293.15

- type: entity
  parent: WFAdminTechTankBase
  id: WFAdminTechTankTritium
  components:
  - type: GasTank
    outputPressure: 101.3
    air:
      volume: 70
      moles:
        Tritium: 28.7
      temperature: 293.15

- type: entity
  parent: WFAdminTechTankBase
  id: WFAdminTechTankFrezon
  components:
  - type: GasTank
    outputPressure: 101.3
    air:
      volume: 70
      moles:
        Frezon: 28.7
      temperature: 293.15

# Beakers.
- type: entity
  parent: BluespaceBeaker
  id: WFAdminTechBeakerSmall
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _WF/AdminTech/beaker.rsi
    layers:
    - state: icon

- type: entity
  parent: BluespaceBeaker
  id: WFAdminTechBeakerStasis
  components:
  - type: Sprite
    sprite: _WF/AdminTech/beaker_stasis.rsi
    layers:
    - state: icon
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 1000
        canReact: false

- type: entity
  parent: WFAdminTechBeakerStasis
  id: WFAdminTechBeakerSmallStasis
  components:
  - type: Item
    size: Tiny

# Subspace condensate and what carries it.
- type: reagent
  id: WFSubspaceCondensate
  name: reagent-name-wf-subspace-condensate
  group: Medicine
  desc: reagent-desc-wf-subspace-condensate
  physicalDesc: reagent-physical-desc-wf-subspace-condensate
  flavor: medicine
  color: "#7a3fc4"
  metabolisms:
    Medicine:
      effects:
      - !type:EvenHealthChange
        damage:
          Burn: -10
          Toxin: -10
          Airloss: -10
          Brute: -10

- type: entity
  parent: BaseMedicalPatch
  id: WFAdminTechPatch
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 20
        reagents:
        - ReagentId: WFSubspaceCondensate
          Quantity: 20

- type: entity
  parent: WFAdminTechPatch
  id: WFAdminTechPatchInstant
  components:
  - type: Sticky
    stickDelay: 0

- type: entity
  parent: Pill
  id: WFAdminTechShard
  components:
  - type: Pill
    pillType: 9
  - type: Sprite
    state: pill10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: WFSubspaceCondensate
          Quantity: 20

- type: entity
  parent: WFAdminTechShard
  id: WFAdminTechShardGel
  components:
  - type: Pill
    pillType: 12
  - type: Sprite
    state: pill13

- type: entity
  parent: Medkit
  id: WFAdminTechSurgeryTray
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,7,3
  - type: StorageFill
    contents:
    - id: EnergyScalpel
    - id: AdvancedRetractor
    - id: EnergyCautery
    - id: SawAdvanced
    - id: Hemostat
    - id: Bonesetter
    - id: BoneGel
    - id: Drill
