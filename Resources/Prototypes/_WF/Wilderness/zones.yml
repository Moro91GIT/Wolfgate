# Zones the rules give a protection status to. Grids and markers name them in a WFZoneSource.

- type: wfZone
  id: WFSafeZone
  kind: Safe
  priority: 30
  radius: 256
  color: "#2e9e4f"
  title: wf-zone-safe-title
  summary: wf-zone-safe-summary
  entered: wf-zone-safe-entered
  left: wf-zone-safe-left
  ringLabel: wf-zone-safe-ring
  alert: WFZoneSafe
  icon:
    sprite: _WF/Wilderness/zones.rsi
    state: safe
  enterSound:
    path: /Audio/Misc/notice2.ogg
  guide: MonolithRuleRoleplaySevenSafeZones

